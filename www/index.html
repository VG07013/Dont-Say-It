<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Don't Say It!</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #121826;
      --muted: #647084;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-strong: #ffffff;
      --line: rgba(15, 23, 42, 0.1);
      --brand: #ff3f6e;
      --brand-dark: #de2455;
      --good: #1f9d55;
      --bad: #e93544;
      --warning: #f4a51c;
      --shadow: 0 24px 64px rgba(20, 24, 39, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #0f172a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 210, 87, 0.52), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(68, 208, 255, 0.42), transparent 28%),
        linear-gradient(145deg, #1f2a44 0%, #ff6f8d 48%, #ffd46d 100%);
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: min(100%, 430px);
      max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      text-align: left;
    }

    .logo {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 13px;
      color: white;
      font-size: 21px;
      font-weight: 900;
      background: linear-gradient(145deg, var(--brand), #ff9f1c);
      box-shadow: 0 10px 28px rgba(255, 63, 110, 0.35);
    }

    .title-block {
      min-width: 0;
      flex: 1;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      margin: 5px 0 0;
      font-size: 13px;
      line-height: 1.35;
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: left;
    }

    .time-control {
      display: grid;
      gap: 9px;
      margin: 14px 0 12px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .time-input {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 46px;
      padding: 0 12px;
      border-radius: 14px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .time-input span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .time-chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .actions,
    .game-actions {
      display: grid;
      gap: 8px;
    }

    .actions {
      grid-template-columns: 1fr;
      margin-top: 12px;
    }

    .game-actions {
      grid-template-columns: repeat(3, 1fr);
    }

    .game-actions .restart {
      grid-column: 1 / -1;
    }

    .app.playing .topbar {
      margin-bottom: 6px;
    }

    .app.playing .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      font-size: 18px;
    }

    .app.playing h1 {
      font-size: 22px;
    }

    .app.playing .subtitle {
      display: none;
    }

    .app.playing #gameDeckInfo {
      display: none;
    }

    .timer {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 8px;
      border-radius: 50%;
      color: white;
      font-size: 36px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      background:
        radial-gradient(circle at center, #1b2335 58%, transparent 59%),
        conic-gradient(var(--brand) var(--timer-progress, 100%), rgba(255, 255, 255, 0.7) 0);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.2);
    }

    .score {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      min-width: 104px;
      min-height: 36px;
      background: #f5f7fb;
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .score span {
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
    }

    .voice-control {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0 0 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.66);
    }

    .voice-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #263246;
      background: #edf1f7;
    }

    .voice-toggle::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.16);
    }

    .voice-toggle.listening {
      color: white;
      background: #121826;
      box-shadow: 0 12px 24px rgba(18, 24, 38, 0.2);
    }

    .voice-toggle.listening::before {
      background: var(--good);
      box-shadow: 0 0 0 5px rgba(31, 157, 85, 0.22);
    }

    .voice-toggle.detected {
      color: white;
      background: var(--bad);
      animation: pop-alert 420ms ease;
    }

    .voice-toggle:disabled {
      color: #7b8798;
      background: #e5e9f0;
      cursor: not-allowed;
      opacity: 0.78;
    }

    .voice-status {
      min-height: 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    @keyframes pop-alert {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.035);
      }

      100% {
        transform: scale(1);
      }
    }

    .card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      margin: 8px 0 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
      text-align: left;
    }

    .word {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px 10px;
      color: var(--brand-dark);
      font-size: clamp(28px, 9vw, 42px);
      line-height: 1;
      font-weight: 900;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .bad-words {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .bad-word {
      display: flex;
      align-items: center;
      min-height: 34px;
      background: #fff7fa;
      border: 1px solid rgba(255, 63, 110, 0.24);
      padding: 7px 10px;
      border-radius: 11px;
      color: #9f1239;
      font-size: 15px;
      font-weight: 800;
      text-align: left;
    }

    button {
      border: none;
      border-radius: 13px;
      min-height: 44px;
      padding: 10px 12px;
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      appearance: none;
      -webkit-appearance: none;
      transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
    }

    button:active {
      transform: scale(0.97);
      filter: brightness(0.96);
    }

    .primary {
      background: #121826;
      color: white;
      box-shadow: 0 12px 24px rgba(18, 24, 38, 0.22);
    }

    .success {
      background: var(--good);
      color: white;
    }

    .danger {
      background: var(--bad);
      color: white;
    }

    .secondary {
      background: #edf1f7;
      color: #263246;
    }

    .ghost {
      color: var(--bad);
      background: rgba(233, 53, 68, 0.1);
    }

    input {
      width: 76px;
      padding: 0;
      border: none;
      outline: none;
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      background: transparent;
      appearance: textfield;
      -webkit-appearance: none;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .message {
      min-height: 24px;
      color: var(--muted);
      font-weight: 800;
      margin-top: 8px;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 340px) {
      .bad-words {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-height: 720px) {
      .app {
        padding: 12px;
      }

      .topbar {
        margin-bottom: 10px;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        font-size: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 14px;
      }

      .timer {
        width: 72px;
        height: 72px;
        margin-bottom: 6px;
        font-size: 32px;
      }

      .score {
        min-height: 34px;
        margin-bottom: 6px;
      }

      .voice-control {
        padding: 7px;
        margin-bottom: 7px;
      }

      .card {
        margin: 7px 0 8px;
        padding: 10px;
      }

      .word {
        min-height: 36px;
        padding-bottom: 8px;
        font-size: clamp(25px, 8.5vw, 36px);
      }

      .bad-word {
        min-height: 31px;
        font-size: 14px;
      }

      .game-actions button {
        min-height: 40px;
      }

      #gameDeckInfo {
        display: none;
      }
    }

    @media (max-width: 370px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .app {
        padding: 12px;
        border-radius: 20px;
      }

      .time-chips {
        grid-template-columns: 1fr 1fr;
      }

      .game-actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">!</div>
      <div class="title-block">
        <h1>Don't Say It!</h1>
        <p class="subtitle">Describe the big word without saying the forbidden words.</p>
      </div>
    </header>

    <div id="setup">
      <div class="time-control">
        <p class="section-label">Round length</p>
        <label class="time-input" for="roundTime">
          <span>Seconds</span>
          <input id="roundTime" type="number" inputmode="numeric" value="60" min="15" max="300" />
        </label>

        <div class="time-chips" aria-label="Quick round length">
          <button class="secondary" onclick="setTime(30)">30 sec</button>
          <button class="secondary" onclick="setTime(60)">60 sec</button>
          <button class="secondary" onclick="setTime(120)">2 min</button>
          <button class="secondary" onclick="setTime(300)">5 min</button>
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="startGame()">Start Game</button>
        <button class="ghost" onclick="resetSavedDeck()">Reset Word Bank</button>
      </div>

      <p class="small" id="deckInfo"></p>
    </div>

    <div id="game" class="hidden">
      <div class="timer" id="timer">60</div>

      <div class="score">
        Score: <span id="score">0</span>
      </div>

      <p class="small" id="gameDeckInfo"></p>

      <div class="voice-control">
        <button class="voice-toggle" id="voiceToggle" type="button" aria-pressed="false" onclick="toggleVoiceCheck()">Voice Check Off</button>
        <div class="voice-status" id="voiceStatus">Not listening</div>
      </div>

      <div class="card">
        <div class="word" id="mainWord">Pizza</div>
        <p class="section-label">Do not say</p>
        <div class="bad-words" id="forbiddenWords"></div>
      </div>

      <div class="message" id="message"></div>

      <div class="game-actions">
        <button class="success" onclick="correct()">Correct</button>
        <button class="danger" onclick="oops()">Oops</button>
        <button class="secondary" onclick="skip()">Skip</button>
        <button class="primary restart" onclick="goHome()">New Round</button>
      </div>
    </div>
  </div>

    function buildQualityWordPool(groups) {
      const wordPool = [];
      const seen = new Set();
      const longestGroup = Math.max(...groups.map(group => group.words.length));

      for (let index = 0; index < longestGroup && wordPool.length < TOTAL_CARD_COUNT; index++) {
        groups.forEach(group => {
          const word = group.words[index];
          if (!word || wordPool.length >= TOTAL_CARD_COUNT) return;

          const normalizedWord = normalizeSpeechText(word);
          if (!/^[a-z0-9]+$/.test(normalizedWord) || seen.has(normalizedWord)) return;

          seen.add(normalizedWord);
          wordPool.push(normalizedWord);
        });
      }

      return wordPool;
    }

    function buildRelatedForbiddenByWord(groups) {
      const relatedByWord = {};

      groups.forEach(group => {
        group.words.forEach((word, index) => {
          const normalizedWord = normalizeSpeechText(word);
          if (relatedByWord[normalizedWord]) return;

          const nearbyWords = getNearbyWords(group.words, index);
          relatedByWord[normalizedWord] = [...group.hints, ...nearbyWords]
            .map(hint => toTitleCase(normalizeSpeechText(hint)))
            .filter(Boolean)
            .filter(uniqueText)
            .filter(hint => normalizeSpeechText(hint) !== normalizedWord)
            .slice(0, 5);
        });
      });

      return relatedByWord;
    }

    function getNearbyWords(groupWords, index) {
      return [
        ...groupWords.slice(Math.max(0, index - 2), index),
        ...groupWords.slice(index + 1, index + 4)

    function buildSeedHintMap(seedCards) {
      const hintMap = new Map();

      seedCards.forEach(card => {
        const cardWords = normalizeSpeechText(card.word).split(" ").filter(Boolean);

        cardWords.forEach(word => {
          addHintsForWord(hintMap, word, card.forbidden);

      seedCards.forEach(card => {
        card.forbidden.forEach((hint, index) => {

          normalizeSpeechText(hint).split(" ").filter(Boolean).forEach(word => {
            addHintsForWord(hintMap, word, siblingHints);

        });
      });

      return hintMap;

    function addHintsForWord(hintMap, word, hintsToAdd) {
      const hints = hintMap.get(word) || [];
      hintsToAdd.forEach(hint => hints.push(hint));
      hintMap.set(word, hints.filter(uniqueText));

      return [...curatedHints, ...relatedHints, ...fallbackHints]
        .filter(uniqueText)
        .filter(hint => normalizeSpeechText(hint) !== word)

        document.getElementById("message").textContent = "Voice check is not available on this browser.";
        updateVoiceControls();
        return;
      }

      voiceEnabled = true;
      ensureAudioContext();
      setVoiceStatus("Listening");
      updateVoiceControls();

      if (nativeSpeech) {
        setupNativeSpeechListener(nativeSpeech);
        nativeSpeech.start()
          .then(() => {
            voiceListening = true;
            setVoiceStatus("Listening");
            updateVoiceControls();
          })
          .catch(error => {
            voiceEnabled = false;
            voiceListening = false;
            const message = error && error.message ? error.message : "Microphone access is blocked.";
            setVoiceStatus("Voice check paused");
            document.getElementById("message").textContent = message;
            updateVoiceControls();
          });
        return;
      }

      ensureRecognition();
      startRecognition();
    }

    function stopVoiceCheck(statusText) {
      voiceEnabled = false;
      voiceListening = false;

      const nativeSpeech = getNativeSpeechPlugin();
      if (nativeSpeech) {
        nativeSpeech.stop().catch(() => {});
      }

      if (recognition) {
        try {
          recognition.abort();
        } catch (error) {
          // The recognizer can already be closed on iOS.
        }
      }

      setVoiceStatus(statusText || "Not listening");
      updateVoiceControls();
    }

    function getNativeSpeechPlugin() {
      return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativeSpeech;
    }

    function hasVoiceSupport() {
      return Boolean(getNativeSpeechPlugin() || SpeechRecognition);
    }

    function setupNativeSpeechListener(nativeSpeech) {
      if (nativeSpeechListenerReady || !nativeSpeech.addListener) return;

      nativeSpeechListenerReady = true;

      nativeSpeech.addListener("speechResult", event => {
        if (!event || !event.transcript) return;
        checkTranscript(event.transcript);
      });

      nativeSpeech.addListener("speechStatus", event => {
        if (!event || typeof event.listening !== "boolean") return;
        voiceListening = event.listening;
        if (voiceEnabled) setVoiceStatus(event.listening ? "Listening" : "Voice check paused");
        updateVoiceControls();
      });

      nativeSpeech.addListener("speechError", event => {
        if (!voiceEnabled) return;

        voiceEnabled = false;
        voiceListening = false;
        setVoiceStatus("Voice check paused");
        document.getElementById("message").textContent = event && event.message ? event.message : "Voice check paused.";
        updateVoiceControls();
      });
    }

    function ensureRecognition() {
      if (recognition || !SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        voiceListening = true;
        setVoiceStatus("Listening");
        updateVoiceControls();
      };

      recognition.onend = () => {
        voiceListening = false;
        updateVoiceControls();

        if (voiceEnabled && timeLeft > 0 && !document.getElementById("game").classList.contains("hidden")) {
          setTimeout(startRecognition, 350);
        }
      };

      recognition.onerror = event => {
        if (!voiceEnabled) return;

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          voiceEnabled = false;
          setVoiceStatus("Microphone blocked");
          document.getElementById("message").textContent = "Microphone access is blocked.";
        } else if (event.error === "no-speech") {
          setVoiceStatus("Listening");
        } else {
          setVoiceStatus("Voice check paused");
        }

        updateVoiceControls();
      };

      recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          checkTranscript(event.results[i][0].transcript);
        }
      };
    }

    function startRecognition() {
      if (!voiceEnabled || !recognition || voiceListening || timeLeft <= 0) return;

      try {
        recognition.start();
      } catch (error) {
        // Some browsers throw if start is called while the engine is warming up.
      }
    }

    function checkTranscript(transcript) {
      if (!voiceEnabled || timeLeft <= 0) return;

      const normalizedTranscript = normalizeSpeechText(transcript);
      const detectedWord = currentForbiddenWords.find(word => transcriptIncludesWord(normalizedTranscript, word));

      if (!detectedWord) return;

      const now = Date.now();
      if (now - lastDetectionAt < DETECTION_COOLDOWN_MS) return;

      lastDetectionAt = now;
      announceDetection(detectedWord);
    }

    function announceDetection(word) {
      const voiceToggle = document.getElementById("voiceToggle");

      setVoiceStatus("Detected: " + word);
      document.getElementById("message").textContent = "Word detected: " + word;
      voiceToggle.classList.add("detected");
      playDetectedSound();
      speakDetected();

      if ("vibrate" in navigator) {
        navigator.vibrate([60, 40, 60]);
      }

      setTimeout(() => {
        voiceToggle.classList.remove("detected");
        if (voiceEnabled) setVoiceStatus("Listening");
        updateVoiceControls();
      }, 900);
    }

    function transcriptIncludesWord(transcript, word) {
      const transcriptTokens = normalizeSpeechText(transcript).split(" ").filter(Boolean);
      const wordTokens = normalizeSpeechText(word).split(" ").filter(Boolean);

      if (wordTokens.length === 0 || transcriptTokens.length < wordTokens.length) return false;

      const variantTokens = wordTokens.map(getWordVariants);

      for (let i = 0; i <= transcriptTokens.length - wordTokens.length; i++) {
        const found = variantTokens.every((variants, offset) => variants.has(transcriptTokens[i + offset]));
        if (found) return true;
      }

      return false;
    }

    function normalizeSpeechText(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .replace(/\s+/g, " ");
    }

    function getWordVariants(word) {
      if (wordVariantCache.has(word)) {
        return wordVariantCache.get(word);
      }

      const variants = new Set([word]);
      addWordFamily(word, variants);

      Array.from(variants).forEach(variant => addWordFamily(variant, variants));

      wordVariantCache.set(word, variants);
      return variants;
    }

    function buildIrregularSingularByPlural(irregulars) {
      const lookup = {};

      Object.entries(irregulars).forEach(([singular, variants]) => {
        variants.forEach(variant => {
          lookup[variant] = singular;
        });
      });

      return lookup;
    }

    function addWordFamily(word, variants) {
      addIrregularVariants(word, variants);
      addSingularVariants(word, variants);
      addPluralVariants(word, variants);
      addVerbVariants(word, variants);
    }

    function addIrregularVariants(word, variants) {
      const irregular = irregularWordVariants[word];
      const singular = irregularSingularByPlural[word];

      if (irregular) {
        irregular.forEach(variant => variants.add(variant));
      }

      if (singular) {
        variants.add(singular);
      }
    }

    function addSingularVariants(word, variants) {
      if (word.length < 3) return;

      if (word.endsWith("ies") && word.length > 3) {
        variants.add(word.slice(0, -3) + "y");
      }

      if (word.endsWith("ves") && word.length > 3) {
        variants.add(word.slice(0, -3) + "f");
        variants.add(word.slice(0, -3) + "fe");
      }

      if (word.endsWith("ches") || word.endsWith("shes")) {
        variants.add(word.slice(0, -2));
      } else if (/(ses|xes|zes)$/.test(word)) {
        variants.add(word.slice(0, -2));
      } else if (word.endsWith("oes") && word.length > 3) {
        variants.add(word.slice(0, -2));
      } else if (word.endsWith("es") && word.length > 3 && !word.endsWith("ees")) {
        variants.add(word.slice(0, -1));
      }

      if (word.endsWith("s") && !word.endsWith("ss") && !word.endsWith("us")) {
        variants.add(word.slice(0, -1));
      }

      if (word.endsWith("i") && word.length > 2) {
        variants.add(word.slice(0, -1) + "us");
      }

      if (word.endsWith("a") && word.length > 2) {
        variants.add(word.slice(0, -1) + "on");
        variants.add(word.slice(0, -1) + "um");
      }
    }

    function addPluralVariants(word, variants) {
      if (word.length < 2) return;

      const lastLetter = word[word.length - 1];
      const secondLastLetter = word[word.length - 2];
      const endsWithSibilant = /(s|x|z|ch|sh)$/.test(word);

      variants.add(word + "s");

      if (endsWithSibilant) {
        variants.add(word + "es");
      }

      if (lastLetter === "y" && !isVowel(secondLastLetter)) {
        variants.add(word.slice(0, -1) + "ies");
      }

      if (lastLetter === "f") {
        variants.add(word.slice(0, -1) + "ves");
      }

      if (word.endsWith("fe")) {
        variants.add(word.slice(0, -2) + "ves");
      }

      if (lastLetter === "o") {
        variants.add(word + "es");
      }

      if (word.endsWith("us") && word.length > 2) {
        variants.add(word.slice(0, -2) + "i");
      }

      if (word.endsWith("is") && word.length > 2) {
        variants.add(word.slice(0, -2) + "es");
      }

      if (word.endsWith("on") && word.length > 2) {
        variants.add(word.slice(0, -2) + "a");
      }

      if (word.endsWith("um") && word.length > 2) {
        variants.add(word.slice(0, -2) + "a");
      }
    }

    function addVerbVariants(word, variants) {
      if (word.length < 3) return;

      const lastLetter = word[word.length - 1];
      const secondLastLetter = word[word.length - 2];

      variants.add(word + "s");
      variants.add(word + "ed");
      variants.add(word + "ing");

      if (lastLetter === "e") {
        variants.add(word + "d");
        variants.add(word.slice(0, -1) + "ing");
      }

      if (lastLetter === "y" && !isVowel(secondLastLetter)) {
        variants.add(word.slice(0, -1) + "ies");
        variants.add(word.slice(0, -1) + "ied");
      }

      if (shouldDoubleFinalConsonant(word)) {
        variants.add(word + lastLetter + "ed");
        variants.add(word + lastLetter + "ing");
      }
    }

    function shouldDoubleFinalConsonant(word) {
      if (word.length < 3) return false;

      const last = word[word.length - 1];
      const middle = word[word.length - 2];
      const first = word[word.length - 3];

      return !isVowel(first) && isVowel(middle) && !isVowel(last) && !"wxy".includes(last);
    }

    function isVowel(letter) {
      return "aeiou".includes(letter);
    }

    function ensureAudioContext() {
      if (audioContext) return;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioContext = new AudioContext();
    }

    function playDetectedSound() {
      ensureAudioContext();
      if (!audioContext) return;

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(720, now);
      oscillator.frequency.exponentialRampToValueAtTime(360, now + 0.18);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.28, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.24);
    }

    function speakDetected() {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance("Word detected");
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function setVoiceStatus(text) {
      const voiceStatus = document.getElementById("voiceStatus");
      if (voiceStatus) voiceStatus.textContent = text;
    }

    function updateVoiceControls() {
      const voiceToggle = document.getElementById("voiceToggle");
      if (!voiceToggle) return;

      if (!hasVoiceSupport()) {
        voiceToggle.textContent = "Voice Check Unavailable";
        voiceToggle.disabled = true;
        voiceToggle.setAttribute("aria-pressed", "false");
        setVoiceStatus("Unavailable");
        return;
      }

      voiceToggle.disabled = false;
      voiceToggle.classList.toggle("listening", voiceEnabled && voiceListening);
      voiceToggle.setAttribute("aria-pressed", voiceEnabled ? "true" : "false");
      voiceToggle.textContent = voiceEnabled ? "Voice Check On" : "Voice Check Off";
    }

    function updateTimerDisplay(seconds, totalSeconds) {
      const safeTotal = Math.max(totalSeconds, 1);
      const safeSeconds = Math.max(seconds, 0);
      const progress = Math.max(0, Math.min(100, (safeSeconds / safeTotal) * 100));
      const timer = document.getElementById("timer");

      if (!timer) return;

      timer.textContent = safeSeconds;
      timer.style.setProperty("--timer-progress", progress + "%");
    }

    function updateScore() {
      document.getElementById("score").textContent = score;
    }

    function updateDeckInfo() {
      const text = "Words left before repeat: " + deck.length + " / " + cards.length;

      const deckInfo = document.getElementById("deckInfo");
      const gameDeckInfo = document.getElementById("gameDeckInfo");

      if (deckInfo) deckInfo.textContent = text;
      if (gameDeckInfo) gameDeckInfo.textContent = text;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function tapFeedback() {
      if ("vibrate" in navigator) {
        navigator.vibrate(8);
      }
    }
  </script>
</body>
</html>
